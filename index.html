<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>みくりちゃんのプリンセスきらきらレッスンDX2</title>
  <meta name="theme-color" content="#ffe6f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="みくりプリンセス">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --pink1: #ffe6f4;
      --pink2: #ffd2ec;
      --lavender: #e7dcff;
      --sky: #dff7ff;
      --gold: #ffd761;
      --hot: #ff5fb7;
      --purple: #8a5cff;
      --blue: #4aa3ff;
      --green: #35c979;
      --red: #ff6464;
      --text: #483154;
      --card: rgba(255, 255, 255, 0.94);
      --shadow: rgba(87, 44, 100, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 12%, rgba(255,255,255,0.85), transparent 26%),
        radial-gradient(circle at 80% 12%, rgba(255,255,255,0.72), transparent 22%),
        linear-gradient(160deg, var(--pink1), var(--sky) 55%, var(--lavender));
      overflow-x: hidden;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      touch-action: manipulation;
    }

    .app {
      width: min(100vw, 540px);
      min-height: 100vh;
      padding: 14px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .sparkle-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating {
      position: absolute;
      opacity: 0.62;
      animation: floatUp 9s linear infinite;
      filter: drop-shadow(0 4px 0 rgba(255,255,255,0.35));
    }

    .floating.one { left: 8%; bottom: -60px; font-size: 35px; animation-delay: -1s; }
    .floating.two { left: 75%; bottom: -80px; font-size: 42px; animation-delay: -4s; animation-duration: 11s; }
    .floating.three { left: 44%; bottom: -70px; font-size: 30px; animation-delay: -7s; animation-duration: 10s; }
    .floating.four { left: 18%; bottom: -100px; font-size: 40px; animation-delay: -5s; animation-duration: 13s; }
    .floating.five { left: 88%; bottom: -110px; font-size: 30px; animation-delay: -9s; animation-duration: 12s; }

    @keyframes floatUp {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-115vh) rotate(360deg); }
    }

    .top-bar, .screen {
      position: relative;
      z-index: 1;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .title {
      font-size: 21px;
      font-weight: 1000;
      line-height: 1.12;
      color: #6b3a85;
      text-shadow: 0 2px 0 rgba(255,255,255,0.95);
      letter-spacing: 0.02em;
    }

    .pill-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .small-btn {
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #ffffff;
      color: #6b3a85;
      font-weight: 900;
      box-shadow: 0 4px 0 rgba(87,44,100,0.15);
      font-size: 15px;
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: 12px;
    }

    .screen.active {
      display: flex;
    }

    .card {
      background: var(--card);
      border-radius: 30px;
      padding: 18px;
      box-shadow: 0 10px 30px var(--shadow);
      border: 3px solid rgba(255,255,255,0.9);
    }

    .hero {
      text-align: center;
      padding: 24px 16px;
      position: relative;
      overflow: hidden;
    }

    .castle {
      font-size: 78px;
      line-height: 1;
      margin: 4px 0 12px;
      animation: castleBounce 1.4s ease-in-out infinite;
      filter: drop-shadow(0 8px 0 rgba(87,44,100,0.10));
    }

    @keyframes castleBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-7px) scale(1.03); }
    }

    .lead {
      font-size: 22px;
      font-weight: 1000;
      line-height: 1.42;
      margin: 8px 0;
    }

    .note {
      font-size: 15px;
      line-height: 1.6;
      margin: 8px 0 0;
      color: #6b6072;
      font-weight: 800;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .mode-btn {
      width: 100%;
      min-height: 86px;
      border-radius: 26px;
      padding: 16px;
      color: white;
      font-size: 22px;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(87,44,100,0.18);
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .mode-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,0.26), transparent);
      transform: translateX(-100%);
      animation: shine 3s ease-in-out infinite;
    }

    @keyframes shine {
      0%, 45% { transform: translateX(-100%); }
      70%, 100% { transform: translateX(100%); }
    }

    .mode-btn span {
      font-size: 44px;
      flex: 0 0 auto;
      z-index: 1;
    }

    .mode-btn div {
      z-index: 1;
    }

    .mode-color { background: linear-gradient(135deg, #ff7ac8, #ff4fa5); }
    .mode-shape { background: linear-gradient(135deg, #a978ff, #7047ff); }
    .mode-animal { background: linear-gradient(135deg, #47cbff, #2a7dff); }
    .mode-mix { background: linear-gradient(135deg, #ffc04d, #ff7c3d); }

    .parent-panel, .collection-panel {
      display: none;
      background: white;
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 4px 0 rgba(87,44,100,0.12);
      font-size: 14px;
      line-height: 1.55;
    }

    .parent-panel.active, .collection-panel.active {
      display: block;
    }

    .parent-panel label {
      display: flex;
      gap: 8px;
      align-items: center;
      font-weight: 900;
      margin: 8px 0;
    }

    .parent-panel input {
      width: 22px;
      height: 22px;
    }

    .treasure-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .treasure {
      min-height: 54px;
      border-radius: 17px;
      background: #f2edf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      filter: grayscale(1);
      opacity: 0.45;
    }

    .treasure.on {
      background: #fff4c7;
      filter: none;
      opacity: 1;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.08);
    }

    .status-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      align-items: center;
    }

    .status-box {
      background: white;
      border-radius: 18px;
      padding: 9px 8px;
      text-align: center;
      font-weight: 1000;
      box-shadow: 0 4px 0 rgba(87,44,100,0.10);
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .jewel-path {
      background: rgba(255,255,255,0.76);
      border-radius: 999px;
      padding: 5px;
      height: 30px;
      position: relative;
      box-shadow: inset 0 3px 0 rgba(87,44,100,0.07);
      overflow: hidden;
    }

    .jewel-line {
      position: absolute;
      inset: 13px 8px auto 8px;
      border-top: 3px dotted rgba(107,58,133,0.25);
    }

    .progress {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff7ac8, #ffd761);
      transition: width 0.35s ease;
      position: relative;
      z-index: 1;
    }

    .mini-princess {
      position: absolute;
      top: -5px;
      left: 0%;
      transform: translateX(-10px);
      z-index: 2;
      font-size: 30px;
      transition: left 0.35s ease;
    }

    .question-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 232px;
      position: relative;
      overflow: hidden;
    }

    .question-label {
      font-size: 21px;
      font-weight: 1000;
      color: #6b3a85;
      margin-bottom: 10px;
    }

    .target-display {
      width: min(64vw, 292px);
      height: min(48vw, 220px);
      min-width: 230px;
      min-height: 180px;
      border-radius: 46px;
      background: radial-gradient(circle at 35% 20%, #ffffff, #fff0c8);
      border: 8px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(74px, 24vw, 128px);
      font-weight: 1000;
      line-height: 1;
      box-shadow: inset 0 -8px 0 rgba(87,44,100,0.08), 0 8px 0 rgba(87,44,100,0.11);
      color: #6b3a85;
      transition: transform 0.18s ease;
    }

    .target-display.pulse {
      animation: targetPulse 0.48s ease;
    }

    @keyframes targetPulse {
      0% { transform: scale(1); }
      45% { transform: scale(1.055); }
      100% { transform: scale(1); }
    }

    .hint {
      margin-top: 14px;
      font-size: 19px;
      font-weight: 1000;
      color: #765c23;
      min-height: 32px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .choice-btn {
      min-height: 132px;
      border-radius: 28px;
      background: #ffffff;
      color: #6b3a85;
      font-size: clamp(54px, 18vw, 86px);
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(87,44,100,0.16);
      border: 4px solid rgba(255,95,183,0.25);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
    }


    .dress-icon {
      width: 86px;
      height: 88px;
      position: relative;
      display: inline-block;
      filter: drop-shadow(0 7px 0 rgba(87,44,100,0.10));
    }

    .dress-icon::before {
      content: "";
      position: absolute;
      left: 29px;
      top: 2px;
      width: 28px;
      height: 30px;
      background: var(--dress-color, #ff7ac8);
      border-radius: 14px 14px 8px 8px;
      box-shadow: inset 0 -4px 0 rgba(87,44,100,0.16);
    }

    .dress-icon::after {
      content: "";
      position: absolute;
      left: 7px;
      bottom: 0;
      width: 72px;
      height: 58px;
      background: var(--dress-color, #ff7ac8);
      clip-path: polygon(50% 0%, 95% 100%, 5% 100%);
      border-radius: 16px;
      box-shadow: inset 0 -7px 0 rgba(87,44,100,0.16);
    }

    .dress-bow {
      position: absolute;
      left: 32px;
      top: 29px;
      width: 22px;
      height: 12px;
      background: #8a3d7a;
      border-radius: 999px;
      z-index: 2;
    }

    .dress-bow::before,
    .dress-bow::after {
      content: "";
      position: absolute;
      top: -3px;
      width: 13px;
      height: 18px;
      background: rgba(255,255,255,0.55);
      border-radius: 999px;
    }

    .dress-bow::before {
      left: -10px;
      transform: rotate(-25deg);
    }

    .dress-bow::after {
      right: -10px;
      transform: rotate(25deg);
    }

    .choice-btn .dress-icon {
      transform: scale(0.95);
    }

    .target-display .dress-icon {
      transform: scale(1.35);
    }

    .choice-label {
      font-size: 20px;
      margin-top: 8px;
      font-weight: 1000;
    }

    .choice-btn:active, .mode-btn:active, .small-btn:active, .big-btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 rgba(87,44,100,0.14);
    }

    .choice-btn.good {
      background: #e1ffe9;
      border-color: var(--green);
      color: #15884d;
      animation: correctPop 0.45s ease;
    }

    .choice-btn.bad {
      background: #ffe4ec;
      border-color: var(--red);
      color: #cf3d58;
      animation: shake 0.26s ease;
    }

    @keyframes correctPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.07); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .message {
      min-height: 64px;
      border-radius: 20px;
      background: white;
      padding: 12px;
      font-size: 20px;
      font-weight: 1000;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 rgba(87,44,100,0.10);
    }

    .message.good-text { color: var(--green); }
    .message.bad-text { color: var(--red); }
    .message.bonus-text { color: var(--purple); }

    .big-btn {
      width: 100%;
      min-height: 64px;
      border-radius: 23px;
      background: linear-gradient(135deg, #ff7ac8, #ff4fa5);
      color: white;
      font-size: 22px;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(87,44,100,0.16);
      padding: 12px 16px;
    }

    .secondary {
      background: linear-gradient(135deg, #a978ff, #7047ff);
    }

    .result-face {
      font-size: 82px;
      text-align: center;
      margin: 8px 0;
      animation: castleBounce 1.2s ease-in-out infinite;
    }

    .result-title {
      font-size: 28px;
      font-weight: 1000;
      text-align: center;
      color: #6b3a85;
      margin: 4px 0 10px;
    }

    .result-score {
      font-size: 24px;
      font-weight: 1000;
      text-align: center;
      margin: 8px 0;
    }

    .stars {
      font-size: 32px;
      text-align: center;
      letter-spacing: 3px;
      min-height: 42px;
    }

    .confetti {
      position: fixed;
      width: 12px;
      height: 16px;
      border-radius: 4px;
      top: -20px;
      z-index: 9;
      pointer-events: none;
      animation: fall 1.25s ease-in forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.86;
      }
    }

    @media (max-width: 360px) {
      .app { padding: 10px; }
      .title { font-size: 18px; }
      .lead { font-size: 20px; }
      .choice-btn { min-height: 116px; }
      .target-display { min-width: 210px; min-height: 164px; }
      .mode-btn { min-height: 78px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="sparkle-bg">
    <div class="floating one">✨</div>
    <div class="floating two">💎</div>
    <div class="floating three">🌸</div>
    <div class="floating four">⭐</div>
    <div class="floating five">💖</div>
  </div>

  <main class="app">
    <div class="top-bar">
      <div class="title">👑 みくりちゃんの<br>プリンセスレッスンDX2</div>
      <div class="pill-row">
        <button id="collectionBtn" class="small-btn" type="button">💎</button>
        <button id="parentBtn" class="small-btn" type="button">おとな</button>
      </div>
    </div>

    <section id="menuScreen" class="screen active">
      <div class="card hero">
        <div class="castle">🏰👸</div>
        <p class="lead">みくりちゃん、<br>プリンセスといっしょに<br>きらきらをあつめよう！</p>
        <p class="note">2歳向け。色・かたち・どうぶつを、音とタッチで楽しく練習します。</p>
      </div>

      <div id="collectionPanel" class="collection-panel">
        <strong>みくりちゃんの たからもの</strong>
        <div id="treasureGrid" class="treasure-grid"></div>
        <p class="note">遊ぶたびに、宝石やティアラが増えます。</p>
      </div>

      <div id="parentPanel" class="parent-panel">
        <strong>おとな向け設定</strong>
        <label>
          <input id="soundToggle" type="checkbox" checked>
          音声・効果音を使う
        </label>
        <label>
          <input id="musicToggle" type="checkbox" checked>
          たのしいメロディを使う
        </label>
        <label>
          <input id="hintToggle" type="checkbox" checked>
          こたえのヒントを出す
        </label>
        <label>
          <input id="autoNextToggle" type="checkbox" checked>
          正解後に自動で次へ進む
        </label>
        <p>音は最初のタップ後に鳴ります。iPhoneのマナーモード中は小さい場合があります。</p>
      </div>

      <div class="menu-grid">
        <button class="mode-btn mode-color" type="button" data-mode="color">
          <div>いろのドレス<br>あか・あお・きいろ</div>
          <span>👗</span>
        </button>
        <button class="mode-btn mode-shape" type="button" data-mode="shape">
          <div>かたちのほうせき<br>まる・さんかく・しかく</div>
          <span>💎</span>
        </button>
        <button class="mode-btn mode-animal" type="button" data-mode="animal">
          <div>どうぶつのおともだち<br>ねこ・いぬ・うさぎ</div>
          <span>🐰</span>
        </button>
        <button class="mode-btn mode-mix" type="button" data-mode="mix">
          <div>みくりちゃんパーティー<br>いろいろあそぶ</div>
          <span>🎉</span>
        </button>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <div class="status-row">
        <div id="questionCount" class="status-box">1 / 5</div>
        <div id="scoreBox" class="status-box">💎 0</div>
        <div id="streakBox" class="status-box">✨ 0</div>
      </div>

      <div class="jewel-path">
        <div class="jewel-line"></div>
        <div id="progressBar" class="progress"></div>
        <div id="miniPrincess" class="mini-princess">👸</div>
      </div>

      <div class="card question-card">
        <div id="questionLabel" class="question-label">みくりちゃん、どっちかな？</div>
        <div id="targetDisplay" class="target-display">👗</div>
        <div id="hintText" class="hint">あかいドレスをえらんでね</div>
      </div>

      <div id="choices" class="choices"></div>

      <div id="message" class="message">みくりちゃん、タッチしてね</div>

      <button id="nextBtn" class="big-btn secondary" type="button" style="display:none;">つぎへ</button>
      <button id="backMenuBtn" class="small-btn" type="button">メニューにもどる</button>
    </section>

    <section id="resultScreen" class="screen">
      <div class="card">
        <div id="resultFace" class="result-face">👑</div>
        <div id="resultTitle" class="result-title">みくりちゃん、すごい！</div>
        <div id="resultScore" class="result-score">5こ中 0こ せいかい</div>
        <div id="resultStars" class="stars">⭐⭐⭐</div>
        <p id="resultMessage" class="lead" style="text-align:center;">たからものをゲットしたよ！</p>
      </div>
      <button id="retryBtn" class="big-btn" type="button">もういっかい</button>
      <button id="homeBtn" class="big-btn secondary" type="button">メニューへ</button>
    </section>
  </main>

  <script>
    "use strict";

    const childName = "みくりちゃん";
    const totalQuestionsDefault = 5;

    const lessonData = {
      color: [
        { id: "red", label: "あか", prompt: "あかいドレスはどっち？", voice: "みくりちゃん、あかいドレスはどっち", emoji: "dress", color: "#ff4f77", hint: "あかいドレスをえらんでね" },
        { id: "blue", label: "あお", prompt: "あおいドレスはどっち？", voice: "みくりちゃん、あおいドレスはどっち", emoji: "dress", color: "#4aa3ff", hint: "あおいドレスをえらんでね" },
        { id: "yellow", label: "きいろ", prompt: "きいろいドレスはどっち？", voice: "みくりちゃん、きいろいドレスはどっち", emoji: "dress", color: "#ffcf3d", hint: "きいろいドレスをえらんでね" },
        { id: "pink", label: "ぴんく", prompt: "ぴんくのドレスはどっち？", voice: "みくりちゃん、ぴんくのドレスはどっち", emoji: "dress", color: "#ff7ac8", hint: "ぴんくのドレスをえらんでね" }
      ],
      shape: [
        { id: "circle", label: "まる", prompt: "まるのほうせきはどっち？", voice: "みくりちゃん、まるのほうせきはどっち", emoji: "●", color: "#ff7ac8", hint: "まるをえらんでね" },
        { id: "triangle", label: "さんかく", prompt: "さんかくのほうせきはどっち？", voice: "みくりちゃん、さんかくのほうせきはどっち", emoji: "▲", color: "#8a5cff", hint: "さんかくをえらんでね" },
        { id: "square", label: "しかく", prompt: "しかくのほうせきはどっち？", voice: "みくりちゃん、しかくのほうせきはどっち", emoji: "■", color: "#4aa3ff", hint: "しかくをえらんでね" },
        { id: "star", label: "ほし", prompt: "ほしのほうせきはどっち？", voice: "みくりちゃん、ほしのほうせきはどっち", emoji: "★", color: "#ffd761", hint: "ほしをえらんでね" }
      ],
      animal: [
        { id: "cat", label: "ねこ", prompt: "ねこさんはどっち？", voice: "みくりちゃん、ねこさんはどっち", emoji: "🐱", color: "#ffffff", hint: "ねこさんをえらんでね" },
        { id: "dog", label: "いぬ", prompt: "いぬさんはどっち？", voice: "みくりちゃん、いぬさんはどっち", emoji: "🐶", color: "#ffffff", hint: "いぬさんをえらんでね" },
        { id: "rabbit", label: "うさぎ", prompt: "うさぎさんはどっち？", voice: "みくりちゃん、うさぎさんはどっち", emoji: "🐰", color: "#ffffff", hint: "うさぎさんをえらんでね" },
        { id: "bear", label: "くま", prompt: "くまさんはどっち？", voice: "みくりちゃん、くまさんはどっち", emoji: "🐻", color: "#ffffff", hint: "くまさんをえらんでね" }
      ]
    };

    const treasureList = ["💎", "👑", "🌸", "🪄", "⭐", "💖", "🦄", "🎀", "🏰", "🌈"];
    const goodMessages = [
      "みくりちゃん、せいかい！",
      "やったね！きらきらゲット！",
      "すごい！よくできたね！",
      "プリンセスにぴったり！"
    ];

    let currentMode = "color";
    let activePool = [];
    let questionIndex = 0;
    let totalQuestions = totalQuestionsDefault;
    let score = 0;
    let streak = 0;
    let maxStreak = 0;
    let currentAnswer = null;
    let locked = false;
    let lastQuestionIds = [];
    let audioContext = null;
    let musicTimer = null;
    let musicStep = 0;

    const menuScreen = document.getElementById("menuScreen");
    const gameScreen = document.getElementById("gameScreen");
    const resultScreen = document.getElementById("resultScreen");
    const parentBtn = document.getElementById("parentBtn");
    const collectionBtn = document.getElementById("collectionBtn");
    const parentPanel = document.getElementById("parentPanel");
    const collectionPanel = document.getElementById("collectionPanel");
    const treasureGrid = document.getElementById("treasureGrid");
    const soundToggle = document.getElementById("soundToggle");
    const musicToggle = document.getElementById("musicToggle");
    const hintToggle = document.getElementById("hintToggle");
    const autoNextToggle = document.getElementById("autoNextToggle");
    const questionCount = document.getElementById("questionCount");
    const scoreBox = document.getElementById("scoreBox");
    const streakBox = document.getElementById("streakBox");
    const progressBar = document.getElementById("progressBar");
    const miniPrincess = document.getElementById("miniPrincess");
    const questionLabel = document.getElementById("questionLabel");
    const targetDisplay = document.getElementById("targetDisplay");
    const hintText = document.getElementById("hintText");
    const choices = document.getElementById("choices");
    const message = document.getElementById("message");
    const nextBtn = document.getElementById("nextBtn");
    const backMenuBtn = document.getElementById("backMenuBtn");
    const retryBtn = document.getElementById("retryBtn");
    const homeBtn = document.getElementById("homeBtn");
    const resultFace = document.getElementById("resultFace");
    const resultTitle = document.getElementById("resultTitle");
    const resultScore = document.getElementById("resultScore");
    const resultStars = document.getElementById("resultStars");
    const resultMessage = document.getElementById("resultMessage");

    function showScreen(screenName) {
      menuScreen.classList.remove("active");
      gameScreen.classList.remove("active");
      resultScreen.classList.remove("active");

      if (screenName === "menu") {
        menuScreen.classList.add("active");
      }

      if (screenName === "game") {
        gameScreen.classList.add("active");
      }

      if (screenName === "result") {
        resultScreen.classList.add("active");
      }
    }

    function ensureAudio() {
      if (!audioContext) {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;

        if (AudioCtor) {
          audioContext = new AudioCtor();
        }
      }

      if (audioContext && audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    function playTone(frequency, duration, type, volume) {
      if (!soundToggle.checked) {
        return;
      }

      ensureAudio();

      if (!audioContext) {
        return;
      }

      const now = audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + 0.03);
    }

    function playCorrectSound() {
      playTone(659.25, 0.11, "sine", 0.08);
      window.setTimeout(function() { playTone(783.99, 0.12, "sine", 0.08); }, 90);
      window.setTimeout(function() { playTone(1046.50, 0.18, "sine", 0.08); }, 180);
    }

    function playWrongSound() {
      playTone(246.94, 0.12, "triangle", 0.06);
      window.setTimeout(function() { playTone(196.00, 0.14, "triangle", 0.055); }, 105);
    }

    function playBonusSound() {
      playTone(783.99, 0.08, "sine", 0.07);
      window.setTimeout(function() { playTone(987.77, 0.08, "sine", 0.07); }, 80);
      window.setTimeout(function() { playTone(1174.66, 0.16, "sine", 0.08); }, 160);
    }

    function startMusic() {
      stopMusic();

      if (!musicToggle.checked || !soundToggle.checked) {
        return;
      }

      ensureAudio();

      if (!audioContext) {
        return;
      }

      const melody = [523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 659.25, 698.46, 783.99, 987.77, 783.99];

      musicTimer = window.setInterval(function() {
        if (!musicToggle.checked || !soundToggle.checked) {
          stopMusic();
          return;
        }

        const freq = melody[musicStep % melody.length];
        playTone(freq, 0.11, "sine", 0.024);
        musicStep += 1;
      }, 360);
    }

    function stopMusic() {
      if (musicTimer) {
        window.clearInterval(musicTimer);
        musicTimer = null;
      }
    }

    function speak(text) {
      if (!soundToggle.checked) {
        return;
      }

      if (!("speechSynthesis" in window)) {
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ja-JP";
      utterance.rate = 0.78;
      utterance.pitch = 1.22;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }

    function shuffleArray(array) {
      const result = array.slice();

      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = result[i];
        result[i] = result[j];
        result[j] = temp;
      }

      return result;
    }

    function getTreasureCount() {
      const saved = window.localStorage.getItem("mikuriPrincessTreasureDX");
      const value = Number(saved);

      if (Number.isFinite(value)) {
        return Math.max(0, Math.min(treasureList.length, value));
      }

      return 0;
    }

    function saveTreasureCount(count) {
      const safeCount = Math.max(0, Math.min(treasureList.length, count));
      window.localStorage.setItem("mikuriPrincessTreasureDX", String(safeCount));
    }

    function renderTreasures() {
      const count = getTreasureCount();
      treasureGrid.innerHTML = "";

      treasureList.forEach(function(treasure, index) {
        const div = document.createElement("div");
        div.className = "treasure";

        if (index < count) {
          div.classList.add("on");
        }

        div.textContent = treasure;
        treasureGrid.appendChild(div);
      });
    }

    function unlockTreasureIfNeeded() {
      const currentCount = getTreasureCount();
      let targetCount = currentCount;

      if (score >= 1) {
        targetCount = Math.max(targetCount, 1);
      }

      if (score >= 3) {
        targetCount = Math.max(targetCount, 2);
      }

      if (score === totalQuestions) {
        targetCount = Math.max(targetCount, 4);
      }

      if (maxStreak >= 3) {
        targetCount = Math.max(targetCount, 5);
      }

      if (currentMode === "mix" && score >= 4) {
        targetCount = Math.max(targetCount, 7);
      }

      if (currentMode === "mix" && score === totalQuestions) {
        targetCount = treasureList.length;
      }

      if (targetCount > currentCount) {
        saveTreasureCount(targetCount);
        return true;
      }

      return false;
    }

    function makePool(mode) {
      if (mode === "mix") {
        return lessonData.color.concat(lessonData.shape).concat(lessonData.animal);
      }

      return lessonData[mode].slice();
    }

    function pickQuestion() {
      let candidates = activePool.slice();

      if (activePool.length > 3) {
        candidates = candidates.filter(function(item) {
          return !lastQuestionIds.includes(item.id + item.prompt);
        });
      }

      if (candidates.length === 0) {
        candidates = activePool.slice();
      }

      const picked = candidates[Math.floor(Math.random() * candidates.length)];
      lastQuestionIds.push(picked.id + picked.prompt);

      if (lastQuestionIds.length > 3) {
        lastQuestionIds.shift();
      }

      return picked;
    }

    function makeWrongChoice(answerItem) {
      let wrongPool = activePool.filter(function(item) {
        return item.id !== answerItem.id || item.label !== answerItem.label;
      });

      if (wrongPool.length === 0) {
        wrongPool = activePool.slice();
      }

      return shuffleArray(wrongPool)[0];
    }

    function updateStatus() {
      questionCount.textContent = String(questionIndex + 1) + " / " + String(totalQuestions);
      scoreBox.textContent = "💎 " + String(score);
      streakBox.textContent = "✨ " + String(streak);
      const progressPercent = Math.round((questionIndex / totalQuestions) * 100);
      progressBar.style.width = String(progressPercent) + "%";
      miniPrincess.style.left = String(progressPercent) + "%";
    }

    function setMessage(text, type) {
      message.textContent = text;
      message.classList.remove("good-text");
      message.classList.remove("bad-text");
      message.classList.remove("bonus-text");

      if (type === "good") {
        message.classList.add("good-text");
      }

      if (type === "bad") {
        message.classList.add("bad-text");
      }

      if (type === "bonus") {
        message.classList.add("bonus-text");
      }
    }

    function createDressElement(item) {
      const wrap = document.createElement("span");
      const bow = document.createElement("span");

      wrap.className = "dress-icon";
      wrap.style.setProperty("--dress-color", item.color);

      bow.className = "dress-bow";
      wrap.appendChild(bow);

      return wrap;
    }

    function applyItemStyle(element, item, isTarget) {
      element.innerHTML = "";

      if (item.emoji === "dress") {
        element.appendChild(createDressElement(item));
      } else {
        element.textContent = item.emoji;
      }

      element.style.color = item.color;
      element.style.textShadow = "0 5px 0 rgba(87,44,100,0.08)";

      if (isTarget) {
        element.style.borderColor = item.color === "#ffffff" ? "#ffd761" : item.color;
      }
    }

    function createChoiceButton(item) {
      const button = document.createElement("button");
      const emojiSpan = document.createElement("div");
      const label = document.createElement("div");

      button.type = "button";
      button.className = "choice-btn";
      button.setAttribute("aria-label", item.label);

      if (item.emoji === "dress") {
        emojiSpan.appendChild(createDressElement(item));
      } else {
        emojiSpan.textContent = item.emoji;
      }

      emojiSpan.style.color = item.color;

      label.className = "choice-label";
      label.textContent = item.label;

      button.appendChild(emojiSpan);
      button.appendChild(label);

      button.addEventListener("click", function() {
        checkAnswer(item, button);
      });

      return button;
    }

    function renderQuestion() {
      locked = false;
      nextBtn.style.display = "none";
      updateStatus();

      currentAnswer = pickQuestion();

      questionLabel.textContent = childName + "、どっちかな？";
      applyItemStyle(targetDisplay, currentAnswer, true);
      targetDisplay.classList.remove("pulse");
      void targetDisplay.offsetWidth;
      targetDisplay.classList.add("pulse");

      if (hintToggle.checked) {
        hintText.textContent = currentAnswer.hint;
      } else {
        hintText.textContent = "";
      }

      setMessage(childName + "、タッチしてね", "");
      choices.innerHTML = "";

      const wrong = makeWrongChoice(currentAnswer);
      const choiceItems = shuffleArray([currentAnswer, wrong]);

      choiceItems.forEach(function(item) {
        choices.appendChild(createChoiceButton(item));
      });

      speak(currentAnswer.voice);
    }

    function createConfetti(count) {
      const palette = ["#ff7ac8", "#ffd761", "#8a5cff", "#4aa3ff", "#35c979", "#ffffff"];

      for (let i = 0; i < count; i += 1) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = String(Math.random() * 100) + "vw";
        piece.style.background = palette[Math.floor(Math.random() * palette.length)];
        piece.style.animationDelay = String(Math.random() * 0.35) + "s";
        piece.style.transform = "rotate(" + String(Math.random() * 180) + "deg)";
        document.body.appendChild(piece);

        window.setTimeout(function() {
          piece.remove();
        }, 1700);
      }
    }

    function checkAnswer(item, button) {
      if (locked) {
        return;
      }

      ensureAudio();

      if (item.id === currentAnswer.id && item.label === currentAnswer.label) {
        locked = true;
        score += 1;
        streak += 1;
        maxStreak = Math.max(maxStreak, streak);
        button.classList.add("good");
        playCorrectSound();

        let text = goodMessages[Math.floor(Math.random() * goodMessages.length)];
        let type = "good";

        if (streak >= 3) {
          text = childName + "、" + String(streak) + "かい れんぞく！";
          type = "bonus";
          playBonusSound();
          createConfetti(14);
        }

        setMessage(text, type);
        speak("みくりちゃん、せいかい。すごいね。");

        Array.from(choices.children).forEach(function(child) {
          child.disabled = true;
        });

        updateStatus();

        if (autoNextToggle.checked) {
          window.setTimeout(function() {
            goNext();
          }, 950);
        } else {
          nextBtn.style.display = "block";
        }

        return;
      }

      button.classList.add("bad");
      button.disabled = true;
      streak = 0;
      updateStatus();
      playWrongSound();
      setMessage("だいじょうぶ。もういっかい！", "bad");
      speak("だいじょうぶ。もういっかい。");
    }

    function goNext() {
      questionIndex += 1;

      if (questionIndex >= totalQuestions) {
        finishGame();
        return;
      }

      renderQuestion();
    }

    function finishGame() {
      progressBar.style.width = "100%";
      miniPrincess.style.left = "100%";
      const unlocked = unlockTreasureIfNeeded();
      renderTreasures();
      stopMusic();

      resultScore.textContent = String(totalQuestions) + "こ中 " + String(score) + "こ せいかい";

      if (score === totalQuestions) {
        resultFace.textContent = "👑";
        resultTitle.textContent = "みくりちゃん、ぜんぶせいかい！";
        resultStars.textContent = "⭐⭐⭐⭐⭐";
        resultMessage.textContent = unlocked ? "新しいたからものをゲットしたよ！" : "プリンセスパーティー大成功！";
        createConfetti(46);
        speak("みくりちゃん、ぜんぶせいかい。すごいね。");
      } else if (score >= 3) {
        resultFace.textContent = "💖";
        resultTitle.textContent = "みくりちゃん、すごい！";
        resultStars.textContent = "⭐⭐⭐⭐";
        resultMessage.textContent = unlocked ? "新しいたからものをゲット！" : "きらきらをたくさん集めたよ！";
        createConfetti(24);
        speak("みくりちゃん、すごいね。");
      } else if (score >= 1) {
        resultFace.textContent = "🌸";
        resultTitle.textContent = "みくりちゃん、がんばったね！";
        resultStars.textContent = "⭐⭐⭐";
        resultMessage.textContent = unlocked ? "たからものをひとつゲット！" : "もういっかいあそぼうね！";
        speak("みくりちゃん、がんばったね。");
      } else {
        resultFace.textContent = "👸";
        resultTitle.textContent = "れんしゅうできたね！";
        resultStars.textContent = "⭐⭐";
        resultMessage.textContent = "ゆっくりでだいじょうぶ！";
        speak("れんしゅうできたね。");
      }

      showScreen("result");
    }

    function startGame(mode) {
      ensureAudio();
      currentMode = mode;
      activePool = makePool(mode);
      totalQuestions = totalQuestionsDefault;
      questionIndex = 0;
      score = 0;
      streak = 0;
      maxStreak = 0;
      currentAnswer = null;
      locked = false;
      lastQuestionIds = [];
      showScreen("game");
      startMusic();
      renderQuestion();
    }

    parentBtn.addEventListener("click", function() {
      parentPanel.classList.toggle("active");
      collectionPanel.classList.remove("active");
    });

    collectionBtn.addEventListener("click", function() {
      renderTreasures();
      collectionPanel.classList.toggle("active");
      parentPanel.classList.remove("active");
    });

    Array.from(document.querySelectorAll(".mode-btn")).forEach(function(button) {
      button.addEventListener("click", function() {
        const mode = button.getAttribute("data-mode");
        startGame(mode);
      });
    });

    nextBtn.addEventListener("click", function() {
      goNext();
    });

    backMenuBtn.addEventListener("click", function() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      stopMusic();
      showScreen("menu");
    });

    retryBtn.addEventListener("click", function() {
      startGame(currentMode);
    });

    homeBtn.addEventListener("click", function() {
      stopMusic();
      showScreen("menu");
    });

    musicToggle.addEventListener("change", function() {
      if (gameScreen.classList.contains("active")) {
        if (musicToggle.checked) {
          startMusic();
        } else {
          stopMusic();
        }
      }
    });

    soundToggle.addEventListener("change", function() {
      if (!soundToggle.checked) {
        stopMusic();

        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
      } else if (gameScreen.classList.contains("active")) {
        startMusic();
      }
    });

    document.addEventListener("visibilitychange", function() {
      if (document.hidden) {
        stopMusic();

        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
      } else if (gameScreen.classList.contains("active")) {
        startMusic();
      }
    });

    renderTreasures();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function() {
          // オフライン対応に失敗しても、ゲーム本体はそのまま動きます。
        });
      });
    }
  </script>
</body>
